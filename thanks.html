<!doctype html>
<html lang="tr" data-title-tr="Teşekkürler — CoreNest" data-title-en="Thank you — CoreNest"
      data-desc-tr="Demo talebiniz CoreNest ekibine ulaştı. En kısa sürede size e-postayla dönüş yapacağız." data-desc-en="Your demo request has reached the CoreNest team. We will get back to you by email shortly.">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Teşekkürler — CoreNest</title>
  <meta name="description" content="Demo talebiniz CoreNest ekibine ulaştı. En kısa sürede size e-postayla dönüş yapacağız."/>
  <meta name="robots" content="noindex"/>
  <link rel="canonical" href="https://corenest.io/thanks"/>
  <meta name="theme-color" content="#08090b"/>
  <link rel="icon" href="/favicon.ico" sizes="32x32"/>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <link rel="manifest" href="/site.webmanifest"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;550;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/website.css"/>

  <script src="/config.js"></script>
  <script src="/analytics.js"></script>
  <script src="/pages.js"></script>
  <script>
    // Count the lead once, only when the visitor arrived here from the form.
    (function () {
      try {
        var interest = sessionStorage.getItem('cn-lead');
        if (interest === null) return;
        sessionStorage.removeItem('cn-lead');
        window.cnTrack('generate_lead', { interest: interest });
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <nav class="nav page-nav">
    <div class="container nav-inner">
      <a class="nav-brand" href="/" aria-label="CoreNest">
        <span class="nav-brand-logo">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        </span>
        <span class="nav-wordmark">CoreNest</span>
      </a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-set-lang="en">EN</button>
        <button type="button" data-set-lang="tr" class="active">TR</button>
      </div>
    </div>
  </nav>

  <main class="status-page">
    <div class="hero-bg"><div class="hero-bg-grid"></div><div class="hero-bg-glow"></div></div>
    <div class="container status-inner">
      <div class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div data-lang="tr">
        <h1>Teşekkürler, talebiniz bize ulaştı.</h1>
        <p class="lede">En kısa sürede size e-postayla dönüş yapacağız.</p>
        <div class="status-actions">
          <a class="btn btn-primary" href="/">Ana sayfaya dön</a>
          <a class="btn btn-secondary" href="/#faq">Sık sorulan sorular</a>
        </div>
      </div>
      <template data-lang="en">
      <div>
        <h1>Thanks, we've got your request.</h1>
        <p class="lede">We'll get back to you by email shortly.</p>
        <div class="status-actions">
          <a class="btn btn-primary" href="/">Back to home</a>
          <a class="btn btn-secondary" href="/#faq">Read the FAQ</a>
        </div>
      </div>
      </template>
    </div>
  </main>
  <footer class="foot">
    <div class="container">
      <div class="foot-bottom" style="border-top: 0; padding-top: 0;">
        <span>© 2026 CoreNest</span>
        <a class="ulink" href="/privacy" data-lang="tr">Gizlilik Politikası</a>
        <a class="ulink" href="/privacy" data-lang="en" hidden>Privacy Policy</a>
        <a class="ulink" href="/terms" data-lang="tr">Kullanım Koşulları</a>
        <a class="ulink" href="/terms" data-lang="en" hidden>Terms of Use</a>
      </div>
    </div>
  </footer>
</body>
</html>
